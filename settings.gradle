pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Sponge Snapshots'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
}

rootProject.name = 'NotEnoughPots'
// 1.13 port: forge only -- there is no Fabric intermediary for 1.13, so there is no :fabric module
// and :common is not a gradle project any more, its sources are compiled straight into :forge
include("forge")
