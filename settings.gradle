pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Sponge Snapshots'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
}

rootProject.name = 'NotEnoughPots'
// 1.12 port: forge only -- there is no Fabric intermediary before 1.14, and :common is not a gradle
// project any more, its sources are compiled straight into :forge
include("forge")
