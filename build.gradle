subprojects {
    
    apply plugin: 'java'
    
    // 1.14 port: Mojang ships Java 8 to end users, so the mod must target Java 8 (matches the 1.14.x MDK)
    java.toolchain.languageVersion = JavaLanguageVersion.of(8)
    java.withSourcesJar()
    java.withJavadocJar()
        
    jar {
        manifest {
            attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_author,
                'Specification-Version'   : project.jar.archiveVersion,
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_author,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'Timestamp'               : System.currentTimeMillis(),
                'Built-On-Java'           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
                'Built-On-Minecraft'      : minecraft_version,
                'Automatic-Module-Name'   : "${group}.${mod_id}"
            ])
        }
    }
    
    repositories {

        mavenCentral()
        mavenCentral()
        maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://repo.spongepowered.org/repository/maven/" }
        maven { url = "https://repo.spongepowered.org/maven/" }
    }
    

    tasks.withType(JavaCompile).configureEach {

        it.options.encoding = 'UTF-8'
        // 1.14 port: no options.release here — javac 8 predates --release, and the Java 8
        // toolchain above already pins source/target compatibility to 8.
    }

    // 1.14 port: JDK 8's javadoc runs doclint by default and is far stricter than 16's
    tasks.withType(Javadoc).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.addStringOption('Xdoclint:none', '-quiet')
    }
}