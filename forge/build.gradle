plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    // 1.17 port: ForgeGradle 6 requires java 17 and does not support mc 1.17
    // 5.1 is the line shipped with the 1.17.1 mdk (needs gradle 7, see gradle/wrapper)
    id 'net.minecraftforge.gradle' version '[5.1,5.2)'
}

version = version
group = group

archivesBaseName = "${mod_id}-forge-${minecraft_version}"

minecraft {
    mappings channel: 'official', version: minecraft_version
    
    if (project.hasProperty('forge_ats_enabled') && project.findProperty('forge_ats_enabled').toBoolean()) {
        // This location is hardcoded in Forge and can not be changed.
        // https://github.com/MinecraftForge/MinecraftForge/blob/be1698bb1554f9c8fa2f58e32b9ab70bc4385e60/fmlloader/src/main/java/net/minecraftforge/fml/loading/moddiscovery/ModFile.java#L123
        accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
        project.logger.debug('Forge Access Transformers are enabled for this project.')
    }

    runs {
        client {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Client'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                modClientRun {
                    source sourceSets.main
                    source project(":common").sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Server'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                modServerRun {
                    source sourceSets.main
                    source project(":common").sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            taskName 'Data'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                modDataRun {
                    source sourceSets.main
                    source project(":common").sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // 1.16 port: no `compileOnly project(":common")` -- common is compiled against Mojang class
    // names (Fabric/loom), which do not exist in Forge's 1.16.5 mappings. See remapCommonToMcp.
}

// 1.16 port: on 1.16.5 Forge's 'official' mapping channel renames *members* to Mojang names but
// leaves *class* names as MCP (net.minecraft.block.Blocks, AbstractBlock, RenderTypeLookup) -- the
// flattening to Mojang class names only landed in 1.17. The shared :common sources are written
// against Mojang class names for Fabric, so translate them here rather than forking a second copy
// of the 72-entry block enum. Member names are identical on both sides, so this is purely types.
var mojmapToMcpTypes = new LinkedHashMap<String, String>()
// order matters: longer/more specific keys first, so "...block.Block" cannot clip "...block.state.X"
mojmapToMcpTypes.put('net.minecraft.world.level.block.state.BlockBehaviour', 'net.minecraft.block.AbstractBlock')
mojmapToMcpTypes.put('net.minecraft.world.level.block.FlowerPotBlock', 'net.minecraft.block.FlowerPotBlock')
mojmapToMcpTypes.put('net.minecraft.world.level.block.StemBlock', 'net.minecraft.block.StemBlock')
mojmapToMcpTypes.put('net.minecraft.world.level.block.Blocks', 'net.minecraft.block.Blocks')
mojmapToMcpTypes.put('net.minecraft.world.level.block.Block', 'net.minecraft.block.Block')
mojmapToMcpTypes.put('net.minecraft.resources.ResourceLocation', 'net.minecraft.util.ResourceLocation')
mojmapToMcpTypes.put('net.minecraft.core.Registry', 'net.minecraft.util.registry.Registry')

// simple names that still differ after the import line has been rewritten
var mojmapToMcpSimpleNames = ['BlockBehaviour': 'AbstractBlock']

var remapCommonToMcp = tasks.register('remapCommonToMcp', Copy) {
    description = "Translates the Mojang-mapped :common sources to the MCP class names Forge uses on ${minecraft_version}"
    from project(":common").sourceSets.main.java
    into layout.buildDirectory.dir('generated/sources/mcp')
    // the rename tables are part of the task's input, otherwise editing them leaves stale output
    inputs.property('mojmapToMcpTypes', mojmapToMcpTypes)
    inputs.property('mojmapToMcpSimpleNames', mojmapToMcpSimpleNames)
    filter { String line ->
        String result = line
        mojmapToMcpTypes.each { mojmap, mcp -> result = result.replace(mojmap, mcp) }
        mojmapToMcpSimpleNames.each { mojmap, mcp -> result = result.replaceAll('\\b' + mojmap + '\\b', mcp) }
        return result
    }
}

sourceSets.main.java.srcDir(remapCommonToMcp)

processResources {
    from project(":common").sourceSets.main.resources

    var expandProps = ['version'                        : version,
                       'group'                          : project.group, //Else we target the task's group.
                       'minecraft_version'              : minecraft_version,
                       'minecraft_version_range'        : minecraft_version_range,
                       'minecraft_version_range_fabric' : minecraft_version_range_fabric,
                       'fabric_version'                 : fabric_version,
                       'fabric_loader_version'          : fabric_loader_version,
                       'mod_name'                       : mod_name,
                       'mod_author'                     : mod_author,
                       'mod_id'                         : mod_id,
                       'description'                    : project.description,
                       "forge_version"                  : forge_version,
                       "forge_version_range"            : forge_version_range,
                       "forge_loader_version_range"     : forge_loader_version_range,
                       'license'                        : license,
                       'java_version'                   : java_version]

    filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', '*.mixins.json']) {
        expand expandProps
    }
}


jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.archivesBaseName
            version project.version
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}
