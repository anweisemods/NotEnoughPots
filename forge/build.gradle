plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    // 1.12 port: the 1.12.2 MDK is on ForgeGradle 3, which is what reads forge 14.23.x userdev3.
    // 5.1 is the same architecture, still ships the MCP mapping channels and runs on gradle 7 with
    // a java 8 gradle jvm -- so the wrapper stays the same as on the newer branches.
    id 'net.minecraftforge.gradle' version '[5.1,5.2)'
}

version = version
group = group

archivesBaseName = "${mod_id}-forge-${minecraft_version}"

minecraft {
    // 1.12 port: Mojang only started publishing obfuscation maps with 1.14.4, MCP is the only option
    mappings channel: mcp_mappings_channel, version: mcp_mappings_version

    runs {
        client {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Client'
            property 'forge.logging.console.level', 'debug'
            mods {
                modClientRun {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Server'
            property 'forge.logging.console.level', 'debug'
            mods {
                modServerRun {
                    source sourceSets.main
                }
            }
        }
    }
}

// 1.12 port: :common is not a gradle project (it only existed to give the fabric side its own
// minecraft dependency); its sources and resources are compiled straight into the forge jar.
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

processResources {
    var expandProps = ['version'                    : version,
                       'group'                      : project.group, //Else we target the task's group.
                       'minecraft_version'          : minecraft_version,
                       'minecraft_version_range'    : minecraft_version_range,
                       'mod_name'                   : mod_name,
                       'mod_author'                 : mod_author,
                       'mod_id'                     : mod_id,
                       'description'                : project.description,
                       "forge_version"              : forge_version,
                       "forge_version_range"        : forge_version_range,
                       "forge_loader_version_range" : forge_loader_version_range,
                       'license'                    : license,
                       'java_version'               : java_version]

    // 1.12 port: mcmod.info instead of META-INF/mods.toml, the toml descriptor only arrives in 1.13
    filesMatching(['pack.mcmeta', 'mcmod.info', 'version.properties']) {
        expand expandProps
    }
}


jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.archivesBaseName
            version project.version
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}
