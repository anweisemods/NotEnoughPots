plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    // 1.13 port: ForgeGradle 6 requires java 17 and drops the MCP mapping channels entirely.
    // 5.1 still consumes forge 25.x userdev and runs on gradle 7 with a java 8 gradle jvm.
    id 'net.minecraftforge.gradle' version '[5.1,5.2)'
}

version = version
group = group

archivesBaseName = "${mod_id}-forge-${minecraft_version}"

minecraft {
    // 1.13 port: Mojang only started publishing obfuscation maps with 1.14.4, so 'official' does
    // not exist for 1.13.2 -- the whole mod is written in MCP names on this branch.
    mappings channel: mcp_mappings_channel, version: mcp_mappings_version

    if (project.hasProperty('forge_ats_enabled') && project.findProperty('forge_ats_enabled').toBoolean()) {
        // This location is hardcoded in Forge and can not be changed.
        // https://github.com/MinecraftForge/MinecraftForge/blob/be1698bb1554f9c8fa2f58e32b9ab70bc4385e60/fmlloader/src/main/java/net/minecraftforge/fml/loading/moddiscovery/ModFile.java#L123
        accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
        project.logger.debug('Forge Access Transformers are enabled for this project.')
    }

    runs {
        client {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Client'
            mods {
                modClientRun {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Server'
            mods {
                modServerRun {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            taskName 'Data'
            mods {
                modDataRun {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

// 1.13 port: :common is no longer a gradle project (it only existed to give the fabric side its own
// minecraft dependency), its sources and resources are compiled straight into the forge jar.
// This also replaces the remapCommonToMcp task the 1.14 - 1.16 branches needed: :common is written
// in MCP names here, so there is nothing left to translate.
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

processResources {
    var expandProps = ['version'                    : version,
                       'group'                      : project.group, //Else we target the task's group.
                       'minecraft_version'          : minecraft_version,
                       'minecraft_version_range'    : minecraft_version_range,
                       'mod_name'                   : mod_name,
                       'mod_author'                 : mod_author,
                       'mod_id'                     : mod_id,
                       'description'                : project.description,
                       "forge_version"              : forge_version,
                       "forge_version_range"        : forge_version_range,
                       "forge_loader_version_range" : forge_loader_version_range,
                       'license'                    : license,
                       'java_version'               : java_version]

    filesMatching(['pack.mcmeta', 'META-INF/mods.toml']) {
        expand expandProps
    }
}


jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.archivesBaseName
            version project.version
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}
