plugins {
    id('java')
    // 1.14 port: loom 0.8+ refuses to apply unless the *Gradle JVM* is Java 16+, which is wrong for a
    // Java 8 game. 0.7.35 is the last line built for Java 8 and still has officialMojangMappings().
    id('fabric-loom') version '0.7.35'
}

archivesBaseName = "${mod_name}-common-${minecraft_version}"
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    compileOnly "org.spongepowered:mixin:0.8.5"

    // Use Map Notation here to avoid the Windows pathing error
    annotationProcessor(group: 'org.spongepowered', name: 'mixin', version: '0.8.5', classifier: 'processor')

    annotationProcessor 'org.ow2.asm:asm-tree:9.2'
    annotationProcessor 'org.ow2.asm:asm-commons:9.2'
    annotationProcessor 'org.ow2.asm:asm-util:9.2'
}

// 1.14 port: :common is a plain shared module, not a mod, so there is no fabric.mod.json for loom
// to read the widener path from -- only the loader jars need the widener remapped into them.
// afterEvaluate, because loom itself only decides this flag once the project has been evaluated.
afterEvaluate {
    remapJar.remapAccessWidener = false
}

loom {
    // 1.14 port: Block.Properties#lightLevel(int) is protected in vanilla (Forge patches it public)
    accessWidener = file('src/main/resources/notenoughpots.accesswidener')

    runs {
        if (project.hasProperty('common_runs_enabled') ? project.findProperty('common_runs_enabled').toBoolean() : true) {
            client {
                client()
                setConfigName("Common Client")
                ideConfigGenerated(true)
                runDir("run")
            }
            server {
                server()
                setConfigName("Common Server")
                ideConfigGenerated(true)
                runDir("run")
            }
        }
    }
}