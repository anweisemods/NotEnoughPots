# Important Notes:
# Every field you add must be added to the root build.gradle expandProps map.
# Project
version=1.5
group=net.anweisen
java_version=8
license=All-Rights-Reserved
# Common
mod_id=notenoughpots
mod_name=NotEnoughPots
mod_author=anweisen
credits=
description=Put all your crops into flower pots
# 1.14 port: compiled against 1.14.4 -- intermediary is identical across 1.14 ... 1.14.4,
# so the fabric jar covers the whole line. Forge shipped separate incompatible lines
# (1.14.2 -> 26.x, 1.14.3 -> 27.x, 1.14.4 -> 28.x) and nothing at all for 1.14/1.14.1,
# so the forge jar is 1.14.4-only.
minecraft_version=1.14.4
common_runs_enabled=false
common_client_run_name=Common Client
common_server_run_name=Common Server
# Forge
forge_version=28.2.26
forge_loader_version_range=[28,)
forge_version_range=[28.2.0,)
minecraft_version_range=[1.14.4,1.15)
//forge_ats_enabled=true
# Fabric
# 1.14 port: 0.28.5+1.14 is the last fabric-api for the 1.14 line; it declares 1.14.x,
# i.e. it covers 1.14 up to 1.14.4.
fabric_version=0.28.5+1.14
fabric_loader_version=0.11.7
minecraft_version_range_fabric=>=1.14 <1.15
# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
