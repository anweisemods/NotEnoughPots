# Important Notes:
# Every field you add must be added to the root build.gradle expandProps map.
# Project
version=1.5
group=net.anweisen
java_version=8
license=All-Rights-Reserved
# Common
mod_id=notenoughpots
mod_name=NotEnoughPots
mod_author=anweisen
credits=
description=Put all your crops into flower pots
# 1.16/1.16.1 port: compiled against 1.16.1 -- there is NO Forge for 1.16.0 (first build is 1.16.1-32.0.1),
# and intermediary is identical across 1.16/1.16.1 so the fabric jar covers both.
minecraft_version=1.16.1
common_runs_enabled=false
common_client_run_name=Common Client
common_server_run_name=Common Server
# Forge
# 1.16/1.16.1 port: forge 32 is the 1.16.1 line. Forge published nothing for 1.16.0, so the forge
# jar is 1.16.1-only; the fabric jar is the one that also covers 1.16.0.
forge_version=32.0.108
forge_loader_version_range=[32,)
forge_version_range=[32.0.0,)
minecraft_version_range=[1.16.1,1.16.2)
//forge_ats_enabled=true
# Fabric
# 1.16/1.16.1 port: 0.14.2+build.373-1.16 is the LAST fabric-api that still declares
# ~1.16-alpha.20.14.a (i.e. supports 1.16 + 1.16.1). build.374 onwards jumps to ~1.16.2.
fabric_version=0.14.2+build.373-1.16
fabric_loader_version=0.11.7
minecraft_version_range_fabric=>=1.16 <1.16.2
# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
