# Important Notes:
# Every field you add must be added to the root build.gradle expandProps map.
# Project
version=1.5
group=net.anweisen
java_version=8
license=All-Rights-Reserved
# Common
mod_id=notenoughpots
mod_name=NotEnoughPots
mod_author=anweisen
credits=
description=Put all your crops into flower pots
# 1.12 port: forge only. Fabric has no intermediary before 1.14, and Forge published separate
# incompatible lines for 1.12 (14.21.x), 1.12.1 (14.22.x) and 1.12.2 (14.23.x) -- MCPConfig only
# exists from 1.12.2 on, so 1.12.2 is the only one that can be built and verified here.
minecraft_version=1.12.2
# Forge
forge_version=14.23.5.2860
forge_loader_version_range=[14.23,)
forge_version_range=[14.23.5.2768,)
minecraft_version_range=[1.12.2]
# 1.12 port: no Mojang mappings before 1.14.4, so the MCP names are the only option here
mcp_mappings_channel=snapshot
mcp_mappings_version=20171003-1.12
# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
