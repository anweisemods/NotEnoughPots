minecraft_version=1.13.2
# Forge
forge_version=25.0.219
forge_loader_version_range=[25,)
forge_version_range=[25.0.0,)
minecraft_version_range=[1.13.2,1.14)
# 1.13 port: no Mojang mappings before 1.14.4, so the MCP names are the only option here
mcp_mappings_channel=snapshot
mcp_mappings_version=20190530-1.13.2
//forge_ats_enabled=true
# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
