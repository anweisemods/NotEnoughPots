# Important Notes:
# Every field you add must be added to the root build.gradle expandProps map.
# Project
version=1.5
group=net.anweisen
java_version=17
# Common
minecraft_version=1.20.1
mod_name=NotEnoughPots
mod_author=anweisen
mod_id=notenoughpots
license=All-Rights-Reserved
credits=
description=Put all your crops into flower pots
minecraft_version_range=[1.20.1, 1.21)
minecraft_version_range_fabric=>=1.20.1 <1.21
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.20.1
parchment_version=2023.09.03
# Fabric
fabric_version=0.92.12+1.20.1
fabric_loader_version=0.16.14
fabric_loader_version_range=>=0.15
# Forge
# 1.20.1 neoforge (47.x) is a soft fork of forge 47 and still uses the net.minecraftforge packages,
# so the forge jar loads on both loaders and there is no separate neoforge module on this version
forge_version=47.4.23
forge_loader_version_range=[47,)
# the forge MOD dependency has to stay loose: neoforge 1.20.1 reports itself as forge 47.1.x,
# so pinning to forge_version would lock the jar out of the loader it is meant to also support
forge_version_range=[47,)
# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
