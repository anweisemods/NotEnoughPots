# Important Notes:
# Every field you add must be added to the root build.gradle expandProps map.
# Project
version=1.5
group=net.anweisen
java_version=8
license=All-Rights-Reserved
# Common
mod_id=notenoughpots
mod_name=NotEnoughPots
mod_author=anweisen
credits=
description=Put all your crops into flower pots
# 1.15 port: compiled against 1.15.2 -- intermediary is identical across 1.15/1.15.1/1.15.2,
# so the fabric jar covers the whole line. Forge shipped separate incompatible lines
# (1.15 -> 29.x, 1.15.1 -> 30.x, 1.15.2 -> 31.x), so the forge jar is 1.15.2-only.
minecraft_version=1.15.2
common_runs_enabled=false
common_client_run_name=Common Client
common_server_run_name=Common Server
# Forge
forge_version=31.2.57
forge_loader_version_range=[31,)
forge_version_range=[31.2.0,)
minecraft_version_range=[1.15.2,1.16)
//forge_ats_enabled=true
# Fabric
# 1.15 port: 0.28.5+1.15 is the last fabric-api for the 1.15 line; it declares
# ~1.15-alpha.19.42.a, i.e. it covers 1.15, 1.15.1 and 1.15.2.
fabric_version=0.28.5+1.15
fabric_loader_version=0.11.7
minecraft_version_range_fabric=>=1.15 <1.16
# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
